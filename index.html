<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SA Fuel Cost Calculator</title>
  <style>
    body {
      body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 16px;
  box-sizing: border-box;

  /* South African Map with an overlay tint for readability */
  background-color: #e5e7eb;
  background-image: 
    linear-gradient(rgba(240, 244, 248, 0.88), rgba(240, 244, 248, 0.88)), 
    url('https://upload.wikimedia.org/wikipedia/commons/2/21/South_Africa_%28orthographic_projection%29.svg');
  background-repeat: no-repeat;
  background-position: center center;
  background-size: 700px auto; /* Adjust size as desired */
  background-attachment: fixed;
}
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; text-align: center; color: #111; }
    p.subtitle { text-align: center; color: #666; font-size: 13px; margin-top: -6px; margin-bottom: 20px; }
    
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: #333; }
    input, select {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0070f3;
    }
    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 6px;
    }
    .radio-label {
      font-weight: normal;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    button {
      width: 100%;
      background: #0070f3;
      color: white;
      border: none;
      padding: 13px;
      margin-top: 22px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .result {
      margin-top: 20px;
      padding: 16px;
      background: #eef6ff;
      border-radius: 8px;
      display: none;
      border-left: 4px solid #0070f3;
    }
    .result p { margin: 6px 0; font-size: 14px; }
    .result .total { font-size: 18px; color: #0070f3; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Trip Fuel Cost</h2>
    <p class="subtitle">South African Fuel Price Calculator</p>
    
    <!-- Zone Selection -->
    <label>Location / Zone</label>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="zone" value="inland" checked onchange="updatePrice()"> Inland (e.g. Gauteng)
      </label>
      <label class="radio-label">
        <input type="radio" name="zone" value="coastal" onchange="updatePrice()"> Coastal (e.g. CPT, DBN)
      </label>
    </div>

    <!-- Fuel Type Selection -->
    <label for="fuelType">Fuel Type</label>
    <select id="fuelType" onchange="updatePrice()">
      <option value="ulp95">Petrol 95 Unleaded (ULP 95)</option>
      <option value="ulp93">Petrol 93 Unleaded (ULP 93)</option>
      <option value="diesel50">Diesel 50ppm (Low Sulphur)</option>
      <option value="diesel500">Diesel 500ppm</option>
      <option value="custom">Custom Price</option>
    </select>

    <!-- Fuel Price per Litre -->
    <label for="price">Fuel Price (ZAR / Litre)</label>
    <input type="number" id="price" placeholder="R per Litre" step="0.01">

    <!-- Distance -->
    <label for="distance">Trip Distance (km)</label>
    <input type="number" id="distance" placeholder="e.g. 120" step="any">

    <!-- Consumption -->
    <label for="consumption">Consumption (Litres / 100km)</label>
    <input type="number" id="consumption" placeholder="e.g. 7.5" step="any">

    <button onclick="calculateCost()">Calculate Total</button>

    <div class="result" id="resultBox">
      <p><strong>Fuel Required:</strong> <span id="litres"></span> L</p>
      <p class="total"><strong>Estimated Cost:</strong> R <span id="cost"></span></p>
    </div>
  </div>

  <script>
    // Standard baseline prices in South Africa (ZAR per Litre)
    // Update these monthly according to the DMRE gazetted figures
    const fuelDatabase = {
      inland: {
        ulp95: 30.25,
        ulp93: 29.88,
        diesel50: 32.79,
        diesel500: 31.95
      },
      coastal: {
        ulp95: 29.38,
        ulp93: 29.09,
        diesel50: 32.03,
        diesel500: 31.08
      }
    };

    // Update the price box whenever region or fuel type changes
    function updatePrice() {
      const zone = document.querySelector('input[name="zone"]:checked').value;
      const fuelType = document.getElementById('fuelType').value;
      const priceInput = document.getElementById('price');

      if (fuelType === 'custom') {
        priceInput.value = '';
        priceInput.placeholder = 'Enter manual price';
        priceInput.focus();
      } else {
        const rate = fuelDatabase[zone][fuelType];
        priceInput.value = rate.toFixed(2);
      }
    }

    function calculateCost() {
      const distance = parseFloat(document.getElementById('distance').value);
      const consumption = parseFloat(document.getElementById('consumption').value);
      const price = parseFloat(document.getElementById('price').value);

      if (isNaN(distance) || isNaN(consumption) || isNaN(price) || distance <= 0 || consumption <= 0 || price <= 0) {
        alert("Please enter valid positive numbers for distance, consumption, and price.");
        return;
      }

      const litresUsed = (distance * consumption) / 100;
      const totalCost = litresUsed * price;

      document.getElementById('litres').textContent = litresUsed.toFixed(2);
      document.getElementById('cost').textContent = totalCost.toFixed(2);
      document.getElementById('resultBox').style.display = 'block';
    }

    // Run once on load to populate default initial price
    updatePrice();
  </script>

</body>
</html>
